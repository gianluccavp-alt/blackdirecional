<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Pró-Soluto Black Friday</title>
<style>
  :root{
    --red:#E8323A; --red-dark:#C4262D;
    --gray:#858382; --gray-dark:#4A4948; --gray-light:#EFEEED; --line:#E2E0DF;
    --ink:#1E1D1C; --bg:#F6F5F4; --card:#FFFFFF; --black:#141313;
    --green:#1F8A4C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  header{background:#fff;border-bottom:4px solid var(--red)}
  .head-in{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{height:64px;display:block}
  .bf{background:var(--black);color:#fff;font-weight:800;letter-spacing:.08em;padding:10px 16px;border-radius:8px;font-size:14px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .bf span{color:var(--red)}
  main{max-width:980px;margin:0 auto;padding:24px 20px 48px}
  h1{font-size:26px;margin:0 0 4px;color:var(--gray-dark)}
  .sub{color:var(--gray);margin:0 0 24px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
  .step-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:14px;color:var(--gray-dark)}
  .num{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .emp{position:relative;border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;transition:.15s;text-align:left;font:inherit;color:inherit}
  .emp:hover{border-color:var(--gray)}
  .emp.sel{border-color:var(--red);background:#FFF5F5;box-shadow:0 0 0 3px rgba(232,50,58,.12)}
  .emp .n{font-weight:700;display:block}
  .emp .d{font-size:13px;color:var(--gray)}
  .emp.sel::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--red);font-weight:800}
  .money{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;background:#fff;max-width:420px;transition:.15s}
  .money:focus-within{border-color:var(--red)}
  .money b{padding:0 6px 0 16px;color:var(--gray);font-size:22px}
  .money input{border:0;outline:0;font-size:26px;font-weight:700;padding:12px 16px 12px 4px;width:100%;background:transparent;color:var(--ink)}
  .hint{font-size:13px;color:var(--gray);margin-top:8px}
  .empty{text-align:center;color:var(--gray);padding:28px 10px;border:2px dashed var(--line);border-radius:14px;background:#fff}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .opt{border-radius:14px;padding:22px;position:relative;overflow:hidden}
  .opt.normal{background:#fff;border:1px solid var(--line)}
  .opt.black{background:var(--black);color:#fff;border:1px solid var(--black)}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:12px}
  .normal .tag{background:var(--gray-light);color:var(--gray-dark)}
  .black .tag{background:var(--red);color:#fff}
  .plan{font-size:15px;opacity:.85}
  .val{font-size:40px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
  .black .val{color:#fff}
  .val small{font-size:16px;font-weight:600;opacity:.7}
  .meta{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:14px;display:grid;gap:6px}
  .black .meta{border-color:#333}
  .meta div{display:flex;justify-content:space-between;gap:10px}
  .meta span:first-child{opacity:.7}
  .meta span:last-child{font-weight:600;text-align:right}
  .save{margin-top:16px;background:#fff;border:2px solid var(--green);border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .save .l{font-weight:600;color:var(--gray-dark)}
  .save .v{font-size:26px;font-weight:800;color:var(--green)}
  .actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--gray-dark);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--ink)}
  .ok{color:var(--green);font-size:14px;font-weight:600}
  .note{font-size:12.5px;color:var(--gray);margin-top:22px;line-height:1.5}
  .cities{display:flex;gap:10px;flex-wrap:wrap}
  .city{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;color:var(--gray-dark);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px}
  .city:hover{border-color:var(--gray)}
  .city.sel{border-color:var(--red);background:var(--red);color:#fff}
  .grid:not(:empty){margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .nsel{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap}
  .nsel select{font:inherit;font-weight:700;font-size:15px;padding:6px 10px;border-radius:8px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .black .nsel select{background:#262424;color:#fff;border-color:#444}
  .nsel select:focus{outline:0;border-color:var(--red)}
  .nprint{display:none;font-weight:700}
  .btn.red{background:var(--red)}
  .btn.red:hover{background:var(--red-dark)}
  .print-only{display:none}
  .pinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
  .pinfo div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .pinfo span{display:block;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}
  .pinfo b{font-size:15px}
  @media print{
    @page{size:A4;margin:14mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{background:#fff;font-size:13px}
    main{padding:16px 0 0}
    .head-in{padding:0 0 10px}
    .logo{height:52px}
    h1{font-size:22px}
    .sub,.step,.actions,.hint{display:none !important}
    .print-only{display:block}
    .nsel select{display:none}
    .nprint{display:inline}
    .res{grid-template-columns:1fr 1fr}
    .opt,.save{break-inside:avoid}
    .val{font-size:32px}
  }
  @media (max-width:680px){
    .pinfo{grid-template-columns:1fr 1fr}
    .res{grid-template-columns:1fr}
    .logo{height:46px}
    .val{font-size:34px}
    h1{font-size:22px}
  }
</style>
</head>

<script>
const CIDADES = ["Campinas", "Ribeirão Preto"];
const EMPS = [
  { cidade: "Campinas",       nome: "Cores da Mata",        ano: 2028, mes: 3 },
  { cidade: "Campinas",       nome: "Alta Vista - Torre 1", ano: 2029, mes: 2 },

  { cidade: "Ribeirão Preto", nome: "Jardim Botânico",      ano: 2026, mes: 12 },
  { cidade: "Ribeirão Preto", nome: "Clube Ipiranga",       ano: 2028, mes: 8 },
];
const TAXA_OBRA = 0.005, TAXA_POS = 0.015, N_NORMAL = 84, N_BF = 60;
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

const hoje = new Date();
const baseIdx = hoje.getFullYear() * 12 + hoje.getMonth();       // mês da simulação
const fmtMes = idx => MESES[idx % 12] + "/" + Math.floor(idx / 12);
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

let cidade = null, sel = null, valor = 0, nNormal = N_NORMAL, nBF = N_BF;

// Registro anônimo das simulações na planilha de acompanhamento (Google Apps Script).
const LOG_URL = "https://script.google.com/macros/s/AKfycbx5GovDVTFphqAcIgHv9pJUnIjmxEsJ3Ydlg_QmCG3DmPkv5CVs7kZroE-voEupkkjprA/exec";
const SESSAO = Math.random().toString(36).slice(2, 10);
const registradas = new Set();
let atual = null, timerLog = null;

function registrar(evento) {
  if (!LOG_URL.startsWith("https://") || !atual) return;
  try {
    fetch(LOG_URL, {
      method: "POST", mode: "no-cors", keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ sessao: SESSAO, evento, ...atual }),
    }).catch(() => {});
  } catch (_) {}
}

// Conta como simulação quando o corretor para de mexer por 3 segundos;
// a mesma combinação (empreendimento, valor, parcelas) só é registrada uma vez por acesso.
function agendarRegistro() {
  clearTimeout(timerLog);
  timerLog = setTimeout(registrarSimulacao, 3000);
}
function registrarSimulacao() {
  clearTimeout(timerLog);
  if (!atual) return;
  const chave = [atual.empreendimento, atual.valor, atual.nNormal, atual.nBF].join("|");
  if (registradas.has(chave)) return;
  registradas.add(chave);
  registrar("simulação");
}

// Parcelas iguais (Price) com taxa mensal variável:
// a parcela k vence no mês base+k; se esse mês for até o mês da entrega (inclusive) → 0,5%, senão → 1,5%.
// PV = Σ P / Π(1+r_j)  ⇒  P = PV / Σ(1/Π(1+r_j))
function price(pv, n, entregaIdx) {
  let fator = 1, soma = 0, obra = 0;
  for (let k = 1; k <= n; k++) {
    const emObra = (baseIdx + k) <= entregaIdx;
    if (emObra) obra++;
    fator *= 1 + (emObra ? TAXA_OBRA : TAXA_POS);
    soma += 1 / fator;
  }
  return { parcela: pv / soma, obra, pos: n - obra };
}

const citiesEl = document.getElementById("cities");
const empsEl = document.getElementById("emps");
CIDADES.forEach(c => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "city"; b.textContent = c;
  b.onclick = () => {
    cidade = c; sel = null;
    [...citiesEl.children].forEach(x => x.classList.toggle("sel", x.textContent === c));
    renderEmps(); render();
  };
  citiesEl.appendChild(b);
});

function renderEmps() {
  empsEl.innerHTML = "";
  EMPS.forEach((e, i) => {
    if (e.cidade !== cidade) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "emp" + (sel === i ? " sel" : "");
    b.innerHTML = `<span class="n">${e.nome}</span><span class="d">Entrega: ${MESES[e.mes-1]}/${e.ano}</span>`;
    b.onclick = () => { sel = i; renderEmps(); render(); document.getElementById("valor").focus(); };
    empsEl.appendChild(b);
  });
}

const opts = max => Array.from({ length: max }, (_, i) => max - i)
  .map(n => `<option value="${n}">${n}x</option>`).join("");

const inp = document.getElementById("valor");
inp.addEventListener("input", () => {
  const dig = inp.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 12);
  valor = dig ? parseInt(dig, 10) / 100 : 0;
  inp.value = dig ? valor.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "";
  render();
});

function render() {
  const out = document.getElementById("out");
  if (sel === null || valor <= 0) {
    const falta = cidade === null ? "Selecione a cidade" : sel === null ? "Selecione o empreendimento" : "Informe o valor do Pró-Soluto";
    out.innerHTML = `<div class="empty">${falta} para ver a simulação.</div>`;
    atual = null; clearTimeout(timerLog);
    return;
  }
  const e = EMPS[sel];
  const entregaIdx = e.ano * 12 + (e.mes - 1);
  const n = price(valor, nNormal, entregaIdx);
  const totalNormal = n.parcela * nNormal;
  const pBF = valor / nBF;
  const economia = totalNormal - valor;
  const hojeTxt = hoje.toLocaleDateString("pt-BR");
  const r2 = v => Math.round(v * 100) / 100;
  atual = {
    cidade: e.cidade, empreendimento: e.nome, entrega: `${MESES[e.mes-1]}/${e.ano}`,
    valor: r2(valor), nNormal, parcelaNormal: r2(n.parcela), totalNormal: r2(totalNormal),
    nBF, parcelaBF: r2(pBF), economia: r2(economia),
    economiaPct: Math.round(economia / totalNormal * 10000) / 10000,
  };
  agendarRegistro();

  out.innerHTML = `
    <div class="print-only">
      <div class="pinfo">
        <div><span>Cidade</span><b>${e.cidade}</b></div>
        <div><span>Empreendimento</span><b>${e.nome}</b></div>
        <div><span>Entrega prevista</span><b>${MESES[e.mes-1]}/${e.ano}</b></div>
        <div><span>Valor do Pró-Soluto</span><b>${brl(valor)}</b></div>
      </div>
    </div>
    <div class="res">
      <div class="opt normal">
        <span class="tag">Condição normal · Até 84x</span>
        <div class="nsel"><select id="selNormal" aria-label="Parcelas na condição normal">${opts(N_NORMAL)}</select><span class="nprint">${nNormal}</span> parcelas fixas de</div>
        <div class="val">${brl(n.parcela)}</div>
        <div class="meta">
          <div><span>Correção em obra (até ${MESES[e.mes-1]}/${e.ano})</span><span>0,5% a.m. · ${n.obra}x</span></div>
          <div><span>Correção pós-obra</span><span>1,5% a.m. · ${n.pos}x</span></div>
          <div><span>Total pago</span><span>${brl(totalNormal)}</span></div>
        </div>
      </div>
      <div class="opt black">
        <span class="tag">Black Friday · Até 60x</span>
        <div class="nsel"><select id="selBF" aria-label="Parcelas na condição Black Friday">${opts(N_BF)}</select><span class="nprint">${nBF}</span> parcelas fixas de</div>
        <div class="val">${brl(pBF)}</div>
        <div class="meta">
          <div><span>Correção</span><span>Sem juros</span></div>
          <div><span>Prazo</span><span>${nBF} ${nBF === 1 ? "mês" : "meses"}</span></div>
          <div><span>Total pago</span><span>${brl(valor)}</span></div>
        </div>
      </div>
    </div>
    <div class="save">
      <span class="l">Economia do cliente na Black Friday</span>
      <span class="v">${brl(economia)}</span>
    </div>
    <div class="actions">
      <button class="btn red" id="pdf" type="button">Gerar PDF da simulação</button>
      <button class="btn" id="copiar" type="button">Copiar resumo para o cliente</button>
      <span class="ok" id="ok"></span>
    </div>`;

  const sN = document.getElementById("selNormal"), sB = document.getElementById("selBF");
  sN.value = nNormal; sB.value = nBF;
  sN.onchange = () => { nNormal = +sN.value; render(); document.getElementById("selNormal").focus(); };
  sB.onchange = () => { nBF = +sB.value; render(); document.getElementById("selBF").focus(); };

  document.getElementById("pdf").onclick = () => {
    registrarSimulacao(); registrar("pdf");
    const t = document.title;
    document.title = `Simulacao Pro-Soluto - ${e.nome} - ${hojeTxt.replace(/\//g, "-")}`;
    window.print();
    document.title = t;
  };

  document.getElementById("copiar").onclick = async () => {
    registrarSimulacao(); registrar("copiar");
    const txt =
`*Simulação Pró-Soluto – ${e.nome}*
Valor do Pró-Soluto: ${brl(valor)}

Condição normal: ${nNormal}x de ${brl(n.parcela)} (total ${brl(totalNormal)})
*Black Friday: ${nBF}x de ${brl(pBF)} SEM JUROS* (total ${brl(valor)})

Economia: ${brl(economia)}`;
    try { await navigator.clipboard.writeText(txt); document.getElementById("ok").textContent = "Copiado!"; }
    catch { document.getElementById("ok").textContent = "Não foi possível copiar."; }
  };
}

document.getElementById("note").textContent =
  `Simulação gerada em ${hoje.toLocaleDateString("pt-BR")}, com data-base em ${fmtMes(baseIdx)} e 1ª parcela em ${fmtMes(baseIdx + 1)}. ` +
  `Na condição normal, as parcelas com vencimento até o mês de entrega (inclusive) são corrigidas a 0,5% a.m. e as seguintes a 1,5% a.m., ` +
  `com parcelas iguais calculadas pelo sistema Price. Valores meramente simulatórios, sujeitos à análise e aprovação.`;

render();
</script>
